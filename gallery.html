<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ไฟล์ของฉัน</title>
<style>
  /* ========================================================
     ตัวแปรสี / ธีม (โหมดสว่าง และ โหมดมืด)
     ======================================================== */
  :root{
    --bg:#F5F6FA;
    --card:#FFFFFF;
    --text:#17202A;
    --text-soft:#7A869A;
    --border:#EAECF1;
    --accent:#00B894;
    --accent-soft:#E5F9F3;
    --shadow:0 2px 10px rgba(23,32,42,0.06);
    --img-color:#4C8DFF;
    --video-color:#FF5A6E;
    --file-color:#FF8A3D;
    --audio-color:#8B5CF6;
  }
  [data-theme="dark"]{
    --bg:#0F1115;
    --card:#181B21;
    --text:#F2F4F7;
    --text-soft:#8A94A6;
    --border:#262A32;
    --accent-soft:#123A31;
    --shadow:0 2px 14px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Sarabun","Noto Sans Thai","Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:background .2s,color .2s;
  }
  .icon{ width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block; }
  .app{
    max-width:720px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }

  /* ========================================================
     หัวหน้าเว็บ + ช่องค้นหา
     ======================================================== */
  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--bg);
    padding:18px 16px 10px;
  }
  .topbar h1{
    font-size:22px;
    margin:0 0 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .theme-btn{
    border:none;
    background:var(--card);
    box-shadow:var(--shadow);
    width:38px;height:38px;
    border-radius:12px;
    color:var(--text);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .theme-btn .icon{ width:19px;height:19px; }
  .theme-btn .icon-moon{ display:none; }
  [data-theme="dark"] .theme-btn .icon-sun{ display:none; }
  [data-theme="dark"] .theme-btn .icon-moon{ display:block; }

  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px 14px;
    box-shadow:var(--shadow);
  }
  .search-box input{
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    font-size:15px;
    width:100%;
    font-family:inherit;
  }
  .search-box .icon{color:var(--text-soft); width:18px;height:18px;}
  .search-box .clear-search{
    border:none;background:var(--border);color:var(--text-soft);
    width:22px;height:22px;border-radius:50%;
    display:none;align-items:center;justify-content:center;cursor:pointer;flex:none;
  }
  .search-box .clear-search .icon{width:12px;height:12px;color:inherit;}
  .search-box.has-value .clear-search{ display:flex; }

  /* ========================================================
     แถวตัวกรอง: เลือกวันที่ + เรียงลำดับ
     ======================================================== */
  .filters-row{
    display:flex;
    gap:8px;
    padding:12px 16px 0;
  }
  .select-wrap{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:0 10px;
    box-shadow:var(--shadow);
    gap:6px;
  }
  .select-wrap .icon{ width:16px;height:16px;color:var(--text-soft); }
  .select-wrap select, .select-wrap input[type="date"]{
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    padding:9px 0;
    width:100%;
  }
  .select-wrap select{ appearance:none; -webkit-appearance:none; }

  .date-filter-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:10px 16px 0;
    padding:10px 12px;
    background:var(--accent-soft);
    border-radius:12px;
    font-size:13px;
    color:var(--text);
  }
  .date-filter-bar span{ display:flex; align-items:center; gap:8px; }
  .date-filter-bar .icon{ color:var(--accent); width:16px;height:16px; }
  .date-filter-bar button{
    display:flex; align-items:center; gap:4px;
    border:none; background:var(--card); color:var(--text);
    border-radius:20px; padding:6px 12px; font-size:12px;
    font-family:inherit; cursor:pointer; box-shadow:var(--shadow);
  }
  .date-filter-bar button .icon{ width:12px;height:12px; color:var(--text); }

  /* แถบสรุปจำนวนไฟล์ */
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px 4px;
    font-size:13px;
    color:var(--text-soft);
  }

  /* ========================================================
     กลุ่มไฟล์ตามวันที่
     ======================================================== */
  .date-section{ padding:14px 16px 0; }
  .date-title{
    font-size:14px;
    font-weight:700;
    color:var(--text-soft);
    margin-bottom:10px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .grid-item{
    position:relative;
    aspect-ratio:1/1;
    border-radius:12px;
    overflow:hidden;
    background:var(--card);
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .grid-item img{ width:100%;height:100%;object-fit:cover; display:block; }
  .grid-item .play-badge{
    position:absolute; inset:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.15);
    pointer-events:none;
  }
  .grid-item .play-badge span{
    width:32px;height:32px;border-radius:50%;
    background:rgba(0,0,0,0.55);
    color:#fff;display:flex;align-items:center;justify-content:center;
  }
  .grid-item .play-badge .icon{ width:14px;height:14px; margin-left:2px; }

  .dl-btn{
    position:absolute;
    border:none; cursor:pointer;
    background:rgba(10,12,16,0.55);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    z-index:2;
  }
  .grid-item .dl-btn{
    top:6px; right:6px;
    width:26px;height:26px;border-radius:50%;
  }
  .grid-item .dl-btn .icon{ width:13px;height:13px; }

  .list-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border-radius:14px;
    padding:12px;
    box-shadow:var(--shadow);
    margin-bottom:8px;
    cursor:pointer;
  }
  .list-icon{
    width:42px;height:42px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;flex:none;
  }
  .list-icon .icon{ width:19px;height:19px; }
  .list-icon.file{ background:var(--file-color); }
  .list-icon.audio{ background:var(--audio-color); }
  .list-meta{ min-width:0; flex:1; }
  .list-meta .name{
    font-size:14px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .list-meta .sub{ font-size:12px;color:var(--text-soft); margin-top:2px; }
  .list-row .dl-btn{
    position:static;
    width:34px;height:34px;border-radius:10px;
    background:var(--bg);
    color:var(--text-soft);
    flex:none;
  }
  .list-row .dl-btn .icon{ width:16px;height:16px; }

  /* สถานะว่าง / กำลังโหลด */
  .empty, .loading-more{
    text-align:center;
    color:var(--text-soft);
    font-size:13px;
    padding:30px 10px;
  }
  .empty .icon{ width:34px;height:34px;color:var(--text-soft); margin-bottom:8px; }
  .skeleton{
    background:linear-gradient(90deg,var(--border) 25%,var(--card) 37%,var(--border) 63%);
    background-size:400% 100%;
    animation:shimmer 1.4s ease infinite;
    border-radius:12px;
  }
  @keyframes shimmer{ 0%{background-position:100% 50%} 100%{background-position:0 50%} }

  .load-more-btn{
    display:block;
    margin:16px auto 0;
    padding:10px 22px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
  }

  /* ========================================================
     Modal ดูไฟล์ (รูป / วิดีโอ / เสียง / เอกสาร)
     ======================================================== */
  .viewer{
    position:fixed; inset:0;
    background:rgba(10,12,16,0.94);
    display:none;
    flex-direction:column;
    z-index:100;
  }
  .viewer.open{ display:flex; }
  .viewer-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    color:#fff;
  }
  .viewer-head .name{
    font-size:14px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    max-width:70%;
  }
  .viewer-head button{
    background:rgba(255,255,255,0.12);
    border:none;color:#fff;
    width:34px;height:34px;border-radius:10px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .viewer-body{
    flex:1;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .viewer-body img{ max-width:100%; max-height:100%; object-fit:contain; touch-action:pan-y; }
  .viewer-body iframe{ width:100%; height:100%; border:none; background:#000; }
  .nav-arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    background:rgba(255,255,255,0.12);
    border:none; color:#fff;
    width:40px;height:40px;border-radius:50%;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .nav-arrow.prev{ left:10px; }
  .nav-arrow.next{ right:10px; }
  .viewer-foot{
    padding:14px 16px 22px;
    display:flex;
    justify-content:center;
    gap:10px;
  }
  .viewer-action{
    display:flex; align-items:center; gap:6px;
    color:#fff;
    font-size:13px;
    text-decoration:none;
    background:rgba(255,255,255,0.12);
    border:none;
    border-radius:20px;
    padding:9px 16px;
    font-family:inherit;
    cursor:pointer;
  }
  .viewer-action .icon{ width:15px;height:15px; }

  /* ========================================================
     Bottom Tab Bar Navigation (สไตล์แอปมือถือ)
     ======================================================== */
  .bottom-nav{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    width:100%;
    max-width:720px;
    display:flex;
    background:var(--card);
    border-top:1px solid var(--border);
    box-shadow:0 -4px 16px rgba(23,32,42,0.08);
    padding:8px 6px calc(6px + env(safe-area-inset-bottom));
    z-index:40;
  }
  .bottom-nav .cat-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    border:none;
    background:transparent;
    cursor:pointer;
    color:var(--text-soft);
    font-family:inherit;
    font-size:11px;
    padding:7px 2px 5px;
    border-radius:14px;
    transition:color .15s;
  }
  .bottom-nav .cat-btn .icon{ width:22px;height:22px; transition:transform .15s; }
  .bottom-nav .cat-btn.active{ color:var(--accent); font-weight:700; }
  .bottom-nav .cat-btn.active .icon{ transform:translateY(-2px); }
</style>
</head>
<body>

<div class="app">

  <!-- แถบบนสุด: ชื่อหน้า + ปุ่มโหมดสว่าง/มืด + ช่องค้นหา -->
  <div class="topbar">
    <h1>
      ไฟล์ของฉัน
      <button class="theme-btn" id="themeBtn" title="สลับโหมดสว่าง/มืด">
        <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </h1>
    <div class="search-box" id="searchBox">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="ค้นหาชื่อไฟล์ / โฟลเดอร์...">
      <button class="clear-search" id="clearSearchBtn" title="ล้างคำค้นหา">
        <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- แถวตัวกรอง: เลือกวันที่ (dropdown) + เรียงลำดับ -->
  <div class="filters-row">
    <div class="select-wrap">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <select id="dateSelect">
        <option value="">ทุกวันที่</option>
        <option value="today">วันนี้</option>
        <option value="yesterday">เมื่อวาน</option>
        <option value="custom">เลือกวันที่...</option>
      </select>
    </div>
    <div class="select-wrap" id="customDateWrap" style="display:none;">
      <input type="date" id="customDateInput">
    </div>
    <div class="select-wrap">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
      <select id="sortSelect">
        <option value="date_desc">ล่าสุดก่อน</option>
        <option value="date_asc">เก่าสุดก่อน</option>
        <option value="name_asc">ชื่อ ก-ฮ</option>
      </select>
    </div>
  </div>

  <div class="date-filter-bar" id="dateFilterBar" style="display:none;">
    <span>
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span id="dateFilterLabel">กำลังกรองไฟล์ตามวันที่ที่เลือก</span>
    </span>
    <button id="clearDateFilterBtn">
      <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      ล้างตัวกรอง
    </button>
  </div>

  <!-- แถบสรุปจำนวนไฟล์ที่พบ -->
  <div class="toolbar">
    <span id="resultCount">กำลังโหลด...</span>
  </div>

  <!-- เนื้อหาไฟล์ทั้งหมด (แบ่งกลุ่มตามวันที่) -->
  <div id="content"></div>

  <div class="empty" id="emptyState" style="display:none;">
    <svg class="icon" viewBox="0 0 24 24" style="width:34px;height:34px;margin:0 auto 8px;display:block;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
    ไม่พบไฟล์ที่ค้นหา
  </div>

  <button class="load-more-btn" id="loadMoreBtn" style="display:none;">โหลดเพิ่มเติม</button>

</div>

<!-- หน้าต่างดูไฟล์แบบเต็มจอ (รองรับปัดซ้าย-ขวาเปลี่ยนไฟล์) -->
<div class="viewer" id="viewer">
  <div class="viewer-head">
    <span class="name" id="viewerName"></span>
    <button id="viewerClose">
      <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="viewer-body" id="viewerBody">
    <button class="nav-arrow prev" id="viewerPrev">
      <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="nav-arrow next" id="viewerNext">
      <svg class="icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <div class="viewer-foot">
    <a id="viewerOpenLink" class="viewer-action" href="#" target="_blank" rel="noopener">
      <svg class="icon" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      <span>เปิดไฟล์ต้นฉบับ</span>
    </a>
    <button id="viewerDownloadBtn" class="viewer-action">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><line x1="5" y1="21" x2="19" y2="21"/></svg>
      <span>ดาวน์โหลด</span>
    </button>
  </div>
</div>

<!-- Bottom Tab Bar: เมนูหมวดหมู่ไฟล์ สไตล์แอปมือถือ -->
<nav class="bottom-nav" id="categoryTabs">
  <button class="cat-btn active" data-type="all" title="ทั้งหมด">
    <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <span>ทั้งหมด</span>
  </button>
  <button class="cat-btn" data-type="image" title="รูปภาพ">
    <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    <span>รูปภาพ</span>
  </button>
  <button class="cat-btn" data-type="video" title="วิดีโอ">
    <svg class="icon" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M10.5 9v6l5-3z" fill="currentColor" stroke="none"/></svg>
    <span>วิดีโอ</span>
  </button>
  <button class="cat-btn" data-type="file" title="เอกสาร">
    <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
    <span>เอกสาร</span>
  </button>
  <button class="cat-btn" data-type="audio" title="เสียง">
    <svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <span>เสียง</span>
  </button>
</nav>

<script>
/* ============================================================
   ตั้งค่าหลัก
   ให้นำ URL ของ Google Apps Script Web App (จากขั้นตอน Deploy)
   มาแปะแทนที่ตรงนี้
   ============================================================ */
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxcDSpvLpcG3JzGgwHkR3mrwfdlSAOQ1oidW6W4owuD4M1FCXh9ti0caI6kbxKiiAXa/exec";

/* ============================================================
   ไอคอน SVG ที่ใช้ซ้ำในเนื้อหาที่สร้างด้วย JavaScript
   ============================================================ */
const ICONS = {
  playBadge: '<svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg>',
  file: '<svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>',
  audio: '<svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  download: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><line x1="5" y1="21" x2="19" y2="21"/></svg>'
};

/* ============================================================
   ตัวแปรสถานะของหน้าเว็บ
   ============================================================ */
const state = {
  type: "all",       // หมวดหมู่ที่เลือกอยู่
  query: "",         // คำค้นหา
  dateFilter: "",    // กรองเฉพาะวันที่ (มาจากลิงก์ใน Flex Message เช่น ?date=2026-08-25 หรือจากดรอปดาวน์เลือกวันที่)
  sort: "date_desc",
  offset: 0,
  limit: 60,
  files: [],         // ไฟล์ทั้งหมดที่โหลดมาแล้ว (สะสมไว้ทำ "โหลดเพิ่ม")
  total: 0,
  loading: false
};

const el = (id) => document.getElementById(id);

/* ============================================================
   โหมดสว่าง / มืด (จำค่าไว้ใน localStorage)
   ============================================================ */
function initTheme(){
  const saved = localStorage.getItem("gallery_theme") || "light";
  document.documentElement.setAttribute("data-theme", saved);
}
el("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", cur);
  localStorage.setItem("gallery_theme", cur);
});
initTheme();

/* ============================================================
   เรียกข้อมูลจาก Google Apps Script แบบ JSONP
   (เลี่ยงปัญหา CORS เวลาเว็บกับ Apps Script อยู่คนละโดเมนกัน)
   ============================================================ */
function fetchFilesJSONP(params){
  return new Promise((resolve, reject) => {

    const cbName = "galleryCb_" + Date.now();
    window[cbName] = (data) => {
      resolve(data);
      delete window[cbName];
      script.remove();
    };

    const query = new URLSearchParams(Object.assign({ callback: cbName }, params));
    const script = document.createElement("script");
    script.src = GAS_API_URL + "?" + query.toString();
    script.onerror = () => reject(new Error("โหลดข้อมูลไม่สำเร็จ"));
    document.body.appendChild(script);

  });
}

/* ============================================================
   โหลดรายการไฟล์ (reset = true คือเริ่มค้นหาใหม่ตั้งแต่หน้าแรก)
   ============================================================ */
async function loadFiles(reset){

  if (state.loading) return;
  state.loading = true;

  if (reset){
    state.offset = 0;
    state.files = [];
    el("content").innerHTML = renderSkeleton();
    el("emptyState").style.display = "none";
  }

  try{

    const data = await fetchFilesJSONP({
      type: state.type,
      q: state.query,
      date: state.dateFilter,
      sort: state.sort,
      limit: state.limit,
      offset: state.offset
    });

    if (!data || data.ok !== true){
      throw new Error("รูปแบบข้อมูลไม่ถูกต้อง");
    }

    state.files = state.files.concat(data.files);
    state.total = data.total;
    state.offset += data.files.length;

    renderFiles();

  }catch(err){
    el("content").innerHTML = "";
    el("emptyState").style.display = "block";
    el("emptyState").innerHTML = '<svg class="icon" viewBox="0 0 24 24" style="width:34px;height:34px;margin:0 auto 8px;display:block;">' +
      '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
      "โหลดข้อมูลไม่สำเร็จ: " + escapeHtml(err.message);
  }finally{
    state.loading = false;
  }

}

/* ============================================================
   สร้าง Skeleton ระหว่างรอโหลดข้อมูลครั้งแรก
   ============================================================ */
function renderSkeleton(){
  let html = '<div class="date-section"><div class="grid">';
  for (let i=0;i<9;i++) html += '<div class="grid-item skeleton"></div>';
  html += '</div></div>';
  return html;
}

/* ============================================================
   จัดกลุ่มไฟล์ตามวันที่ แล้ววาดผลลัพธ์ทั้งหมด
   ============================================================ */
function renderFiles(){

  el("resultCount").textContent = "พบทั้งหมด " + state.total + " ไฟล์";

  if (state.files.length === 0){
    el("content").innerHTML = "";
    el("emptyState").style.display = "block";
    el("loadMoreBtn").style.display = "none";
    return;
  }

  el("emptyState").style.display = "none";

  // จัดกลุ่มตาม dateFolder (ถ้าไม่มีให้ใช้วันที่จาก createdText แทน)
  const groups = {};
  const order = [];

  state.files.forEach((f) => {
    const key = f.dateFolder || (f.createdText || "").split(" ")[0];
    if (!groups[key]){
      groups[key] = [];
      order.push(key);
    }
    groups[key].push(f);
  });

  let html = "";

  order.forEach((key) => {

    const items = groups[key];
    html += '<div class="date-section"><div class="date-title">' + toThaiDateLabel(key) + '</div>';

    // แสดงเป็นกริดรูปภาพ ถ้าไฟล์ในกลุ่มนี้ส่วนใหญ่เป็นรูป/วิดีโอ
    const mediaCount = items.filter(f => f.type === "image" || f.type === "video").length;

    if (mediaCount === items.length){
      html += '<div class="grid">';
      items.forEach(f => { html += renderGridItem(f); });
      html += '</div>';
    } else {
      items.forEach(f => { html += renderListRow(f); });
    }

    html += '</div>';

  });

  el("content").innerHTML = html;

  // ผูก event ให้ทุกไฟล์ที่แสดงผล กดแล้วเปิดหน้าต่างดูไฟล์ (ยกเว้นปุ่มดาวน์โหลด)
  document.querySelectorAll("[data-file-id]").forEach((node) => {
    node.addEventListener("click", () => openViewer(node.getAttribute("data-file-id")));

    const dlBtn = node.querySelector(".dl-btn");
    if (dlBtn){
      dlBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const f = state.files.find(x => x.id === node.getAttribute("data-file-id"));
        if (f) downloadFile(f);
      });
    }
  });

  el("loadMoreBtn").style.display = state.offset < state.total ? "block" : "none";

}

/* แปลงชื่อโฟลเดอร์วันที่ (2026-08-25) ให้เป็นภาษาไทยอ่านง่าย */
function toThaiDateLabel(dateStr){

  const months = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
                  "กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

  const parts = (dateStr || "").split("-");
  if (parts.length !== 3) return dateStr || "ไม่ทราบวันที่";

  const y = parseInt(parts[0], 10) + 543; // แปลงเป็น พ.ศ.
  const m = parseInt(parts[1], 10) - 1;
  const d = parseInt(parts[2], 10);

  if (isNaN(y) || isNaN(d) || !months[m]) return dateStr;

  return d + " " + months[m] + " " + y;

}

function renderGridItem(f){
  const badge = f.type === "video" ? '<div class="play-badge"><span>' + ICONS.playBadge + '</span></div>' : "";
  return '<div class="grid-item" data-file-id="' + f.id + '">' +
           '<img loading="lazy" src="' + f.thumbUrl + '" alt="' + escapeHtml(f.name) + '">' +
           badge +
           '<button class="dl-btn" title="ดาวน์โหลด">' + ICONS.download + '</button>' +
         '</div>';
}

function renderListRow(f){
  const iconClass = f.type === "audio" ? "audio" : "file";
  const iconSvg = f.type === "audio" ? ICONS.audio : ICONS.file;
  return '<div class="list-row" data-file-id="' + f.id + '">' +
           '<div class="list-icon ' + iconClass + '">' + iconSvg + '</div>' +
           '<div class="list-meta">' +
             '<div class="name">' + escapeHtml(f.name) + '</div>' +
             '<div class="sub">' + f.sizeText + ' · ' + f.createdText + '</div>' +
           '</div>' +
           '<button class="dl-btn" title="ดาวน์โหลด">' + ICONS.download + '</button>' +
         '</div>';
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, (c) => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

/* ============================================================
   ดาวน์โหลดไฟล์
   ใช้ downloadUrl จาก backend ถ้ามี ไม่งั้นใช้ลิงก์ดาวน์โหลดของ
   Google Drive โดยตรงจาก id ของไฟล์
   ============================================================ */
function driveDownloadUrl(f){
  return "https://drive.google.com/uc?export=download&id=" + encodeURIComponent(f.id);
}

function downloadFile(f){
  if (!f) return;
  const a = document.createElement("a");
  a.href = f.downloadUrl || driveDownloadUrl(f);
  a.download = f.name || "";
  a.target = "_blank";
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* ============================================================
   หน้าต่างดูไฟล์แบบเต็มจอ (รูป / วิดีโอ / เสียง / เอกสาร)
   ============================================================ */
let viewerIndex = -1;

function openViewer(fileId){
  viewerIndex = state.files.findIndex(f => f.id === fileId);
  if (viewerIndex === -1) return;
  showViewerItem();
  el("viewer").classList.add("open");
}

function closeViewer(){
  el("viewer").classList.remove("open");
  el("viewerBody").querySelectorAll("iframe,img").forEach(n => n.remove());
}

function showViewerItem(){

  const f = state.files[viewerIndex];
  if (!f) return;

  el("viewerName").textContent = f.name;
  el("viewerOpenLink").href = f.openUrl;

  const body = el("viewerBody");
  body.querySelectorAll("iframe,img").forEach(n => n.remove());

  let node;
  if (f.type === "image"){
    node = document.createElement("img");
    node.src = "https://lh3.googleusercontent.com/d/" + f.id + "=w1600";
  } else {
    // วิดีโอ / เสียง / เอกสาร (PDF ฯลฯ) ใช้ตัวแสดงตัวอย่างของ Google Drive
    node = document.createElement("iframe");
    node.src = f.viewUrl;
    node.setAttribute("allow", "autoplay");
  }

  body.insertBefore(node, el("viewerPrev"));

}

el("viewerClose").addEventListener("click", closeViewer);
el("viewerPrev").addEventListener("click", () => {
  if (viewerIndex > 0){ viewerIndex--; showViewerItem(); }
});
el("viewerNext").addEventListener("click", () => {
  if (viewerIndex < state.files.length - 1){ viewerIndex++; showViewerItem(); }
});
el("viewerDownloadBtn").addEventListener("click", () => {
  downloadFile(state.files[viewerIndex]);
});

/* รองรับปัดซ้าย-ขวา (Swipe) บนจอสัมผัส เพื่อเปลี่ยนไฟล์ */
let touchStartX = 0;
el("viewerBody").addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; });
el("viewerBody").addEventListener("touchend", (e) => {
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(diff) < 50) return;
  if (diff > 0) el("viewerPrev").click(); else el("viewerNext").click();
});

/* ============================================================
   ผูก Event ต่าง ๆ ของหน้าจอหลัก
   ============================================================ */

// สลับหมวดหมู่ไฟล์ (Bottom Tab Bar)
el("categoryTabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".cat-btn");
  if (!btn) return;
  document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  state.type = btn.getAttribute("data-type");
  loadFiles(true);
});

// ค้นหา (หน่วงเวลาเล็กน้อยกันยิง API ถี่เกินไป)
let searchTimer = null;
el("searchInput").addEventListener("input", (e) => {
  const val = e.target.value;
  el("searchBox").classList.toggle("has-value", val.trim().length > 0);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = val.trim();
    loadFiles(true);
  }, 350);
});
el("clearSearchBtn").addEventListener("click", () => {
  el("searchInput").value = "";
  el("searchBox").classList.remove("has-value");
  state.query = "";
  loadFiles(true);
});

// เรียงลำดับ
el("sortSelect").addEventListener("change", (e) => {
  state.sort = e.target.value;
  loadFiles(true);
});

/* ============================================================
   ตัวกรองวันที่ (ดรอปดาวน์เลือกวันที่ + เลือกวันที่เอง)
   ============================================================ */
function pad2(n){ return String(n).padStart(2, "0"); }
function dateToStr(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function todayStr(){ return dateToStr(new Date()); }
function yesterdayStr(){ const d = new Date(); d.setDate(d.getDate()-1); return dateToStr(d); }

function updateDateFilterBar(){
  if (state.dateFilter){
    el("dateFilterBar").style.display = "flex";
    el("dateFilterLabel").textContent = "กำลังกรองไฟล์ของวันที่ " + toThaiDateLabel(state.dateFilter);
  } else {
    el("dateFilterBar").style.display = "none";
  }
}

el("dateSelect").addEventListener("change", (e) => {
  const v = e.target.value;
  el("customDateWrap").style.display = v === "custom" ? "flex" : "none";

  if (v === "custom"){
    if (el("customDateInput").value) state.dateFilter = el("customDateInput").value;
    else return; // รอผู้ใช้เลือกวันที่ก่อน
  } else if (v === "today"){
    state.dateFilter = todayStr();
  } else if (v === "yesterday"){
    state.dateFilter = yesterdayStr();
  } else {
    state.dateFilter = "";
  }

  updateDateFilterBar();
  loadFiles(true);
});

el("customDateInput").addEventListener("change", (e) => {
  state.dateFilter = e.target.value;
  updateDateFilterBar();
  loadFiles(true);
});

el("clearDateFilterBtn").addEventListener("click", () => {
  state.dateFilter = "";
  el("dateSelect").value = "";
  el("customDateWrap").style.display = "none";
  updateDateFilterBar();
  loadFiles(true);
});

// โหลดเพิ่มเติม
el("loadMoreBtn").addEventListener("click", () => loadFiles(false));

/* ============================================================
   เริ่มทำงาน: อ่านค่าจาก URL (?date=YYYY-MM-DD) เผื่อมาจากปุ่มใน LINE
   เพื่อกรองให้เห็นไฟล์ของวันที่ถูกส่งมาโดยอัตโนมัติ
   ============================================================ */
(function init(){
  const urlParams = new URLSearchParams(window.location.search);
  const dateParam = urlParams.get("date");
  if (dateParam){
    state.dateFilter = dateParam;
    if (dateParam === todayStr()){
      el("dateSelect").value = "today";
    } else if (dateParam === yesterdayStr()){
      el("dateSelect").value = "yesterday";
    } else {
      el("dateSelect").value = "custom";
      el("customDateInput").value = dateParam;
      el("customDateWrap").style.display = "flex";
    }
    updateDateFilterBar();
  }
  loadFiles(true);
})();
</script>
