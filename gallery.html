<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bot Save</title>
<style>
  /* ========================================================
     ตัวแปรสี / ธีม (โหมดสว่าง และ โหมดมืด)
     ======================================================== */
  :root{
    --bg:#F5F6FA;
    --card:#FFFFFF;
    --text:#17202A;
    --text-soft:#7A869A;
    --border:#EAECF1;
    --accent:#2F6FED;
    --accent-soft:#E8F0FE;
    --shadow:0 2px 10px rgba(23,32,42,0.06);
    --img-color:#4C8DFF;
    --video-color:#FF5A6E;
    --file-color:#FF8A3D;
    --audio-color:#8B5CF6;
    --pdf-color:#EF4444;
    --excel-color:#22A559;
    --word-color:#2F6FED;
    --archive-color:#B8860B;
  }
  [data-theme="dark"]{
    --bg:#0F1115;
    --card:#181B21;
    --text:#F2F4F7;
    --text-soft:#8A94A6;
    --border:#262A32;
    --accent-soft:#132A4A;
    --shadow:0 2px 14px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Sarabun","Noto Sans Thai","Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:background .2s,color .2s;
  }
  .icon{ width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block; }
  .app{
    max-width:720px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }

  /* ========================================================
     หัวหน้าเว็บ + ช่องค้นหา
     ======================================================== */
  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(245,246,250,0.86);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    border-bottom:1px solid var(--border);
  }
  [data-theme="dark"] .topbar{
    background:rgba(15,17,21,0.78);
  }

  /* ========================================================
     Navbar: ไอคอนตราสัญลักษณ์ + ชื่อหน้า/จำนวนไฟล์ + ปุ่มค้นหา/ธีม
     ======================================================== */
  .navbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 16px;
  }
  .navbar-title{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .title-icon{
    width:34px;height:34px;flex:none;
    border-radius:10px;
    background:var(--accent-soft);
    color:var(--accent);
    display:flex;align-items:center;justify-content:center;
  }
  .title-icon .icon{ width:17px;height:17px; }
  .navbar-text{ min-width:0; }
  .navbar h1{
    font-size:18px;
    font-weight:800;
    letter-spacing:-.2px;
    margin:0;
    line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .navbar-subtitle{
    font-size:12px;
    color:var(--text-soft);
    margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .navbar-actions{
    display:flex;
    gap:8px;
    flex:none;
  }
  .nav-icon-btn{
    position:relative;
    border:none;
    background:var(--card);
    box-shadow:var(--shadow);
    width:38px;height:38px;
    border-radius:12px;
    color:var(--text-soft);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex:none;
    transition:color .15s,background .15s,transform .15s;
  }
  .nav-icon-btn:active{ transform:scale(0.92); }
  .nav-icon-btn .icon{ width:18px;height:18px; }
  .nav-icon-btn.active{ background:var(--accent-soft); color:var(--accent); }

  .theme-btn .icon-moon{ display:none; }
  [data-theme="dark"] .theme-btn .icon-sun{ display:none; }
  [data-theme="dark"] .theme-btn .icon-moon{ display:block; }

  /* ========================================================
     แผงค้นหา + ตัวกรอง (เปิดเป็นแผ่นดรอปดาวน์เมื่อกดปุ่มแว่นขยาย)
     ======================================================== */
  .search-panel{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transform:translateY(-6px);
    transition:max-height .3s cubic-bezier(.4,0,.2,1), opacity .22s ease, transform .3s cubic-bezier(.4,0,.2,1);
    background:var(--card);
    box-shadow:0 14px 28px rgba(23,32,42,0.10);
  }
  .search-panel.open{
    max-height:230px;
    opacity:1;
    transform:translateY(0);
  }
  .search-panel.open.dd-open{
    overflow:visible;
  }
  .search-panel-inner{
    padding:12px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px 14px;
  }
  .search-box input{
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    font-size:15px;
    width:100%;
    font-family:inherit;
  }
  .search-box .icon{color:var(--text-soft); width:18px;height:18px;}
  .search-box .clear-search{
    border:none;background:var(--border);color:var(--text-soft);
    width:22px;height:22px;border-radius:50%;
    display:none;align-items:center;justify-content:center;cursor:pointer;flex:none;
  }
  .search-box .clear-search .icon{width:12px;height:12px;color:inherit;}
  .search-box.has-value .clear-search{ display:flex; }

  /* ========================================================
     แถวตัวกรอง: เลือกวันที่ + เรียงลำดับ
     ======================================================== */
  .filters-row{
    display:flex;
    gap:8px;
    padding:0;
  }
  .select-wrap{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:0 10px;
    gap:6px;
  }
  .select-wrap .icon{ width:16px;height:16px;color:var(--text-soft); }
  .select-wrap input[type="date"]{
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    padding:9px 0;
    width:100%;
    color-scheme:light;
  }
  [data-theme="dark"] .select-wrap input[type="date"]{
    color-scheme:dark;
  }

  /* ========================================================
     ดรอปดาวน์แบบกำหนดเอง (แทน <select> เดิม ให้หน้าตาตรงกับธีมแอปทุกจุด)
     ======================================================== */
  .dd{
    position:relative;
    flex:1;
  }
  .dd-trigger{
    display:flex;
    align-items:center;
    gap:7px;
    width:100%;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:9px 10px;
    font-family:inherit;
    font-size:13px;
    color:var(--text);
    cursor:pointer;
    transition:border-color .15s;
  }
  .dd-trigger .dd-lead-icon{ width:16px;height:16px;color:var(--text-soft);flex:none; }
  .dd-trigger .dd-value{
    flex:1;
    text-align:left;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .dd-trigger .dd-chevron{ width:14px;height:14px;color:var(--text-soft);flex:none; transition:transform .2s; }
  .dd.open .dd-trigger{ border-color:var(--accent); }
  .dd.open .dd-trigger .dd-chevron{ transform:rotate(180deg); }

  .dd-menu{
    position:absolute;
    top:calc(100% + 6px);
    left:0; right:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:0 16px 32px rgba(23,32,42,0.16);
    padding:6px;
    z-index:30;
    max-height:0;
    opacity:0;
    overflow:hidden;
    pointer-events:none;
    transform:translateY(-6px);
    transition:max-height .22s cubic-bezier(.4,0,.2,1), opacity .18s ease, transform .22s cubic-bezier(.4,0,.2,1);
  }
  [data-theme="dark"] .dd-menu{
    box-shadow:0 16px 32px rgba(0,0,0,0.5);
  }
  .dd.open .dd-menu{
    max-height:280px;
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .dd-option{
    display:block;
    width:100%;
    text-align:left;
    border:none;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    padding:10px 10px;
    border-radius:9px;
    cursor:pointer;
  }
  .dd-option:active{ background:var(--border); }
  .dd-option.selected{
    background:var(--accent-soft);
    color:var(--accent);
    font-weight:700;
  }

  .date-filter-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:10px 16px 0;
    padding:10px 12px;
    background:var(--accent-soft);
    border-radius:12px;
    font-size:13px;
    color:var(--text);
  }
  .date-filter-bar span{ display:flex; align-items:center; gap:8px; }
  .date-filter-bar .icon{ color:var(--accent); width:16px;height:16px; }
  .date-filter-bar button{
    display:flex; align-items:center; gap:4px;
    border:none; background:var(--card); color:var(--text);
    border-radius:20px; padding:6px 12px; font-size:12px;
    font-family:inherit; cursor:pointer; box-shadow:var(--shadow);
  }
  .date-filter-bar button .icon{ width:12px;height:12px; color:var(--text); }

  /* ========================================================
     กลุ่มไฟล์ตามวันที่
     ======================================================== */
  .date-section{ padding:14px 16px 0; }
  .date-title{
    font-size:14px;
    font-weight:700;
    color:var(--text-soft);
    margin-bottom:10px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .grid-item{
    position:relative;
    aspect-ratio:1/1;
    border-radius:12px;
    overflow:hidden;
    background:var(--card);
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .grid-item img{ width:100%;height:100%;object-fit:cover; display:block; }
  .grid-item .play-badge{
    position:absolute; inset:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.15);
    pointer-events:none;
  }
  .grid-item .play-badge span{
    width:32px;height:32px;border-radius:50%;
    background:rgba(0,0,0,0.55);
    color:#fff;display:flex;align-items:center;justify-content:center;
  }
  .grid-item .play-badge .icon{ width:14px;height:14px; margin-left:2px; }

  .dl-btn{
    position:absolute;
    border:none; cursor:pointer;
    background:rgba(10,12,16,0.55);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    z-index:2;
  }
  .grid-item .dl-btn{
    top:6px; right:6px;
    width:26px;height:26px;border-radius:50%;
  }
  .grid-item .dl-btn .icon{ width:13px;height:13px; }

  /* ========================================================
     เลือกหลายไฟล์ (Multi-select) เพื่อดาวน์โหลดพร้อมกัน
     ======================================================== */
  .select-check{
    display:none;
    align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.9);
    background:rgba(10,12,16,0.32);
    color:#fff;
    flex:none;
  }
  .select-check .icon{ width:12px;height:12px;stroke-width:3;opacity:0;transition:opacity .12s; }
  .grid-item .select-check{ position:absolute; top:6px; left:6px; z-index:3; }
  .list-row .select-check{
    border-color:var(--border);
    background:var(--bg);
    color:#fff;
  }
  body.select-mode .select-check{ display:flex; }
  body.select-mode .dl-btn{ display:none; }
  .grid-item.selected .select-check,
  .list-row.selected .select-check{
    background:var(--accent);
    border-color:var(--accent);
  }
  .grid-item.selected .select-check .icon,
  .list-row.selected .select-check .icon{ opacity:1; }
  .grid-item.selected{ outline:3px solid var(--accent); outline-offset:-3px; }
  .list-row.selected{ background:var(--accent-soft); }

  .selection-bar{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    width:100%;
    max-width:720px;
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--card);
    border-top:1px solid var(--border);
    box-shadow:0 -4px 16px rgba(23,32,42,0.08);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    z-index:45;
  }
  body.select-mode .selection-bar{ display:flex; }
  body.select-mode .bottom-nav{ display:none; }
  .selection-cancel{
    border:none; background:transparent; color:var(--text-soft);
    font-family:inherit; font-size:14px; cursor:pointer; padding:8px 6px; flex:none;
  }
  .selection-count{ font-size:13px; font-weight:700; color:var(--text); flex:1; text-align:center; }
  .selection-download{
    display:flex; align-items:center; gap:6px;
    border:none; background:var(--accent); color:#fff;
    font-family:inherit; font-size:14px; font-weight:700;
    border-radius:20px; padding:10px 18px; cursor:pointer; flex:none;
  }
  .selection-download .icon{ width:15px;height:15px; }
  .selection-download:disabled{ opacity:.4; cursor:default; }

  /* ========================================================
     กล่องยืนยัน (Confirm) สไตล์แอปมือถือ
     ======================================================== */
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(10,12,16,0.45);
    display:none;
    align-items:center; justify-content:center;
    z-index:200;
    padding:24px;
  }
  .modal-backdrop.open{ display:flex; }
  .confirm-box{
    width:100%; max-width:300px;
    background:var(--card);
    border-radius:18px;
    padding:20px 18px 0;
    text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,0.3);
    animation:confirmPop .16s ease;
  }
  @keyframes confirmPop{ from{ transform:scale(.92); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .confirm-title{ font-size:16px; font-weight:800; color:var(--text); margin-bottom:6px; }
  .confirm-message{ font-size:13px; color:var(--text-soft); line-height:1.55; margin-bottom:18px; }
  .confirm-actions{
    display:flex;
    border-top:1px solid var(--border);
    margin:0 -18px;
  }
  .confirm-btn{
    flex:1; border:none; background:transparent;
    padding:13px 0; font-size:14px; font-family:inherit; cursor:pointer; color:var(--text);
  }
  .confirm-btn.cancel{ color:var(--text-soft); border-right:1px solid var(--border); }
  .confirm-btn.ok{ color:var(--accent); font-weight:700; }

  /* ========================================================
     ป้ายแจ้งเตือนแบบลอย (Toast)
     ======================================================== */
  .toast{
    position:fixed;
    left:50%;
    bottom:96px;
    transform:translate(-50%,16px);
    background:rgba(23,32,42,0.94);
    color:#fff;
    padding:10px 18px;
    border-radius:24px;
    font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
    z-index:210;
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    display:flex; align-items:center; gap:8px;
    max-width:82%;
    text-align:center;
  }
  .toast .icon{ width:15px;height:15px; flex:none; }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
  body.select-mode .toast{ bottom:78px; }

  .list-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border-radius:14px;
    padding:12px;
    box-shadow:var(--shadow);
    margin-bottom:8px;
    cursor:pointer;
  }
  .list-icon{
    width:42px;height:42px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;flex:none;
  }
  .list-icon .icon{ width:19px;height:19px; }
  .list-icon.file{ background:var(--file-color); }
  .list-icon.audio{ background:var(--audio-color); }
  .list-icon.pdf{ background:var(--pdf-color); }
  .list-icon.excel{ background:var(--excel-color); }
  .list-icon.word{ background:var(--word-color); }
  .list-icon.archive{ background:var(--archive-color); }
  .list-meta{ min-width:0; flex:1; }
  .list-meta .name{
    font-size:14px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .list-meta .sub{ font-size:12px;color:var(--text-soft); margin-top:2px; }
  .list-row .dl-btn{
    position:static;
    width:34px;height:34px;border-radius:10px;
    background:var(--bg);
    color:var(--text-soft);
    flex:none;
  }
  .list-row .dl-btn .icon{ width:16px;height:16px; }

  /* สถานะว่าง / กำลังโหลด */
  .empty, .loading-more{
    text-align:center;
    color:var(--text-soft);
    font-size:13px;
    padding:30px 10px;
  }
  .empty .icon{ width:34px;height:34px;color:var(--text-soft); margin-bottom:8px; }
  .skeleton{
    background:linear-gradient(90deg,var(--border) 25%,var(--card) 37%,var(--border) 63%);
    background-size:400% 100%;
    animation:shimmer 1.4s ease infinite;
    border-radius:12px;
  }
  @keyframes shimmer{ 0%{background-position:100% 50%} 100%{background-position:0 50%} }

  .load-more-btn{
    display:block;
    margin:16px auto 0;
    padding:10px 22px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
  }

  /* ========================================================
     ดึงหน้าจอลงเพื่อรีเฟรช (Pull to refresh)
     ======================================================== */
  .ptr-indicator{
    position:fixed;
    left:50%;
    top:0;
    transform:translate(-50%,-60px);
    width:38px;height:38px;
    border-radius:50%;
    background:var(--card);
    box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);
    z-index:50;
    transition:transform .15s ease, opacity .15s ease;
    opacity:0;
    pointer-events:none;
  }
  .ptr-indicator .icon{ width:18px;height:18px; transition:transform .1s linear; }
  .ptr-indicator.dragging{ transition:none; }
  .ptr-indicator.spin .icon{ animation:ptr-spin .7s linear infinite; }
  @keyframes ptr-spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  #content.ptr-snap{ transition:transform .22s cubic-bezier(.4,0,.2,1); }

  /* ========================================================
     Modal ดูไฟล์ (รูป / วิดีโอ / เสียง / เอกสาร)
     ======================================================== */
  .viewer{
    position:fixed; inset:0;
    background:rgba(10,12,16,0.94);
    display:none;
    flex-direction:column;
    z-index:100;
  }
  .viewer.open{ display:flex; }
  .viewer-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    color:#fff;
  }
  .viewer-head .name{
    font-size:14px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    max-width:70%;
  }
  .viewer-head button{
    background:rgba(255,255,255,0.12);
    border:none;color:#fff;
    width:34px;height:34px;border-radius:10px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .viewer-body{
    flex:1;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .viewer-body img{ max-width:100%; max-height:100%; object-fit:contain; touch-action:pan-y; }
  .viewer-body iframe{ width:100%; height:100%; border:none; background:#000; }
  .nav-arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    background:rgba(255,255,255,0.12);
    border:none; color:#fff;
    width:40px;height:40px;border-radius:50%;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .nav-arrow.prev{ left:10px; }
  .nav-arrow.next{ right:10px; }
  .viewer-foot{
    padding:14px 16px 22px;
    display:flex;
    justify-content:center;
    gap:10px;
  }
  .viewer-action{
    display:flex; align-items:center; gap:6px;
    color:#fff;
    font-size:13px;
    text-decoration:none;
    background:rgba(255,255,255,0.12);
    border:none;
    border-radius:20px;
    padding:9px 16px;
    font-family:inherit;
    cursor:pointer;
  }
  .viewer-action .icon{ width:15px;height:15px; }

  /* ========================================================
     Bottom Tab Bar Navigation (สไตล์แอปมือถือ)
     ======================================================== */
  .bottom-nav{
    position:fixed;
    left:50%;

<!-- ป้ายแจ้งเตือนลอย (Toast) -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ตั้งค่าหลัก
   ให้นำ URL ของ Google Apps Script Web App (จากขั้นตอน Deploy)
   มาแปะแทนที่ตรงนี้
   ============================================================ */
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxcDSpvLpcG3JzGgwHkR3mrwfdlSAOQ1oidW6W4owuD4M1FCXh9ti0caI6kbxKiiAXa/exec";

/* ============================================================
   ไอคอน SVG ที่ใช้ซ้ำในเนื้อหาที่สร้างด้วย JavaScript
   ============================================================ */
const ICONS = {
  playBadge: '<svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg>',
  file: '<svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>',
  audio: '<svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  download: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><line x1="5" y1="21" x2="19" y2="21"/></svg>',
  pdf: '<svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><text x="7" y="18" font-size="7" font-weight="700" fill="currentColor" stroke="none" font-family="sans-serif">PDF</text></svg>',
  excel: '<svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13l3 5M11 13l-3 5"/></svg>',
  word: '<svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M7 13l1.3 5L10 14l1.7 4L13 13"/></svg>',
  archive: '<svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="10" y1="11" x2="10" y2="12"/><line x1="10" y1="13" x2="10" y2="14"/><line x1="10" y1="15" x2="10" y2="16"/><circle cx="10" cy="18" r="1.4"/></svg>',
  check: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg>'
};

/* ============================================================
   จำแนกชนิดไฟล์เอกสารจากนามสกุลไฟล์ เพื่อเลือกไอคอน/สีที่เหมาะสม
   (pdf, excel, word, ไฟล์บีบอัด ฯลฯ) แทนที่จะใช้ไอคอนไฟล์ทั่วไปทั้งหมด
   ============================================================ */
function getDocKind(f){
  if (f.type === "audio") return { cls: "audio", icon: ICONS.audio };

  const ext = (f.name || "").split(".").pop().toLowerCase();

  if (ext === "pdf") return { cls: "pdf", icon: ICONS.pdf };
  if (["xls","xlsx","xlsm","csv"].includes(ext)) return { cls: "excel", icon: ICONS.excel };
  if (["doc","docx"].includes(ext)) return { cls: "word", icon: ICONS.word };
  if (["zip","rar","7z"].includes(ext)) return { cls: "archive", icon: ICONS.archive };

  return { cls: "file", icon: ICONS.file };
}

/* ============================================================
   ตัวแปรสถานะของหน้าเว็บ
   ============================================================ */
const state = {
  type: "all",       // หมวดหมู่ที่เลือกอยู่
  query: "",         // คำค้นหา
  dateFilter: "",    // กรองเฉพาะวันที่ (มาจากลิงก์ใน Flex Message เช่น ?date=2026-08-25 หรือจากดรอปดาวน์เลือกวันที่)
  sort: "date_desc",
  offset: 0,
  limit: 60,
  files: [],         // ไฟล์ทั้งหมดที่โหลดมาแล้ว (สะสมไว้ทำ "โหลดเพิ่ม")
  total: 0,
  loading: false,
  selectMode: false, // กำลังอยู่ในโหมดเลือกหลายไฟล์อยู่หรือไม่
  selected: new Set() // id ของไฟล์ที่เลือกไว้ในโหมดเลือกหลายไฟล์
};

const el = (id) => document.getElementById(id);

/* ============================================================
   โหมดสว่าง / มืด (จำค่าไว้ใน localStorage)
   ============================================================ */
function initTheme(){
  const saved = localStorage.getItem("gallery_theme") || "light";
  document.documentElement.setAttribute("data-theme", saved);
}
el("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", cur);
  localStorage.setItem("gallery_theme", cur);
});
initTheme();

/* ============================================================
   เรียกข้อมูลจาก Google Apps Script แบบ JSONP
   (เลี่ยงปัญหา CORS เวลาเว็บกับ Apps Script อยู่คนละโดเมนกัน)
   ============================================================ */
function fetchFilesJSONP(params){
  return new Promise((resolve, reject) => {

    const cbName = "galleryCb_" + Date.now();
    window[cbName] = (data) => {
      resolve(data);
      delete window[cbName];
      script.remove();
    };

    const query = new URLSearchParams(Object.assign({ callback: cbName }, params));
    const script = document.createElement("script");
    script.src = GAS_API_URL + "?" + query.toString();
    script.onerror = () => reject(new Error("โหลดข้อมูลไม่สำเร็จ"));
    document.body.appendChild(script);

  });
}

/* ============================================================
   โหลดรายการไฟล์ (reset = true คือเริ่มค้นหาใหม่ตั้งแต่หน้าแรก)
   ============================================================ */
async function loadFiles(reset, silent){

  if (state.loading) return false;
  state.loading = true;

  if (reset){
    state.offset = 0;
    state.files = [];
    if (!silent){
      el("content").innerHTML = renderSkeleton();
      el("emptyState").style.display = "none";
    }
  }

  try{

    const data = await fetchFilesJSONP({
      type: state.type,
      q: state.query,
      date: state.dateFilter,
      sort: state.sort,
      limit: state.limit,
      offset: state.offset
    });

    if (!data || data.ok !== true){
      throw new Error("รูปแบบข้อมูลไม่ถูกต้อง");
    }

    state.files = state.files.concat(data.files);
    state.total = data.total;
    state.offset += data.files.length;

    renderFiles();
    return true;

  }catch(err){
    el("content").innerHTML = "";
    el("emptyState").style.display = "block";
    el("emptyState").innerHTML = '<svg class="icon" viewBox="0 0 24 24" style="width:34px;height:34px;margin:0 auto 8px;display:block;">' +
      '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
      "โหลดข้อมูลไม่สำเร็จ: " + escapeHtml(err.message);
    return false;
  }finally{
    state.loading = false;
  }

}

/* ============================================================
   สร้าง Skeleton ระหว่างรอโหลดข้อมูลครั้งแรก
   ============================================================ */
function renderSkeleton(){
  let html = '<div class="date-section"><div class="grid">';
  for (let i=0;i<9;i++) html += '<div class="grid-item skeleton"></div>';
  html += '</div></div>';
  return html;
}

/* ============================================================
   จัดกลุ่มไฟล์ตามวันที่ แล้ววาดผลลัพธ์ทั้งหมด
   ============================================================ */
function renderFiles(){

  el("navSubtitle").textContent = "พบทั้งหมด " + state.total + " ไฟล์";

  if (state.files.length === 0){
    el("content").innerHTML = "";
    el("emptyState").style.display = "block";
    el("loadMoreBtn").style.display = "none";
    return;
  }

  el("emptyState").style.display = "none";

  // จัดกลุ่มตาม dateFolder (ถ้าไม่มีให้ใช้วันที่จาก createdText แทน)
  const groups = {};
  const order = [];

  state.files.forEach((f) => {
    const key = f.dateFolder || (f.createdText || "").split(" ")[0];
    if (!groups[key]){
      groups[key] = [];
      order.push(key);
    }
    groups[key].push(f);
  });

  let html = "";

  order.forEach((key) => {

    const items = groups[key];
    html += '<div class="date-section"><div class="date-title">' + toThaiDateLabel(key) + '</div>';

    // แยกไฟล์ในกลุ่มตามชนิดของ "แต่ละไฟล์" เอง ไม่ใช่ดูภาพรวมทั้งกลุ่ม
    // รูปภาพ/วิดีโอ -> แสดงเป็นกริดรูปขนาดย่อ
    // เอกสาร/ไฟล์เสียง (pdf, excel, ฯลฯ) -> แสดงเป็นรายการพร้อมไอคอนของชนิดไฟล์นั้น
    const mediaItems = items.filter(f => f.type === "image" || f.type === "video");
    const otherItems = items.filter(f => f.type !== "image" && f.type !== "video");

    if (mediaItems.length){
      html += '<div class="grid">';
      mediaItems.forEach(f => { html += renderGridItem(f); });
      html += '</div>';
    }

    if (otherItems.length){
      html += '<div class="file-list"' + (mediaItems.length ? ' style="margin-top:8px;"' : '') + '>';
      otherItems.forEach(f => { html += renderListRow(f); });
      html += '</div>';
    }

    html += '</div>';

  });

  el("content").innerHTML = html;

  // ผูก event ให้ทุกไฟล์ที่แสดงผล กดแล้วเปิดหน้าต่างดูไฟล์ (ยกเว้นปุ่มดาวน์โหลด)
  // หรือถ้าอยู่ในโหมดเลือกหลายไฟล์ ให้กดแล้วติ๊กเลือก/ยกเลิกเลือกแทน
  document.querySelectorAll("[data-file-id]").forEach((node) => {
    const id = node.getAttribute("data-file-id");
    node.classList.toggle("selected", state.selected.has(id));

    node.addEventListener("click", () => {
      if (state.selectMode){
        toggleFileSelection(id, node);
        return;
      }
      openViewer(id);
    });

    const dlBtn = node.querySelector(".dl-btn");
    if (dlBtn){
      dlBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const f = state.files.find(x => x.id === id);
        if (f) confirmAndDownload(f);
      });
    }
  });

  el("loadMoreBtn").style.display = state.offset < state.total ? "block" : "none";

}

/* แปลงชื่อโฟลเดอร์วันที่ (2026-08-25) ให้เป็นภาษาไทยอ่านง่าย */
function toThaiDateLabel(dateStr){

  const months = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
                  "กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

  const parts = (dateStr || "").split("-");
  if (parts.length !== 3) return dateStr || "ไม่ทราบวันที่";

  const y = parseInt(parts[0], 10) + 543; // แปลงเป็น พ.ศ.
  const m = parseInt(parts[1], 10) - 1;
  const d = parseInt(parts[2], 10);

  if (isNaN(y) || isNaN(d) || !months[m]) return dateStr;

  return d + " " + months[m] + " " + y;

}

function renderGridItem(f){
  const badge = f.type === "video" ? '<div class="play-badge"><span>' + ICONS.playBadge + '</span></div>' : "";
  return '<div class="grid-item" data-file-id="' + f.id + '">' +
           '<img loading="lazy" src="' + f.thumbUrl + '" alt="' + escapeHtml(f.name) + '">' +
           badge +
           '<div class="select-check">' + ICONS.check + '</div>' +
           '<button class="dl-btn" title="ดาวน์โหลด">' + ICONS.download + '</button>' +
         '</div>';
}

function renderListRow(f){
  const kind = getDocKind(f);
  return '<div class="list-row" data-file-id="' + f.id + '">' +
           '<div class="select-check">' + ICONS.check + '</div>' +
           '<div class="list-icon ' + kind.cls + '">' + kind.icon + '</div>' +
           '<div class="list-meta">' +
             '<div class="name">' + escapeHtml(f.name) + '</div>' +
             '<div class="sub">' + f.sizeText + ' · ' + f.createdText + '</div>' +
           '</div>' +
           '<button class="dl-btn" title="ดาวน์โหลด">' + ICONS.download + '</button>' +
         '</div>';
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, (c) => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

/* ============================================================
   ดาวน์โหลดไฟล์
   ใช้ downloadUrl จาก backend ถ้ามี ไม่งั้นใช้ลิงก์ดาวน์โหลดของ
   Google Drive โดยตรงจาก id ของไฟล์
   ============================================================ */
function driveDownloadUrl(f){
  return "https://drive.google.com/uc?export=download&id=" + encodeURIComponent(f.id);
}

function downloadFile(f){
  if (!f) return;
  const a = document.createElement("a");
  a.href = f.downloadUrl || driveDownloadUrl(f);
  a.download = f.name || "";
  a.target = "_blank";
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* ============================================================
   กล่องยืนยันสไตล์แอปมือถือ (แทน confirm() ของเบราว์เซอร์)
   ใช้ Promise<boolean>: true = กดตกลง, false = กดยกเลิก/ปิด
   ============================================================ */
function showConfirm(title, message, okText, cancelText){
  return new Promise((resolve) => {
    el("confirmTitle").textContent = title;
    el("confirmMessage").textContent = message;
    el("confirmOkBtn").textContent = okText || "ตกลง";
    el("confirmCancelBtn").textContent = cancelText || "ยกเลิก";
    el("confirmBackdrop").classList.add("open");

    function cleanup(result){
      el("confirmBackdrop").classList.remove("open");
      el("confirmOkBtn").removeEventListener("click", onOk);
      el("confirmCancelBtn").removeEventListener("click", onCancel);
      el("confirmBackdrop").removeEventListener("click", onBackdrop);
      resolve(result);
    }
    function onOk(){ cleanup(true); }
    function onCancel(){ cleanup(false); }
    function onBackdrop(e){ if (e.target === el("confirmBackdrop")) cleanup(false); }

    el("confirmOkBtn").addEventListener("click", onOk);
    el("confirmCancelBtn").addEventListener("click", onCancel);
    el("confirmBackdrop").addEventListener("click", onBackdrop);
  });
}

/* ============================================================
   ป้ายแจ้งเตือนลอย (Toast)
   ============================================================ */
let toastTimer = null;
function showToast(message){
  const t = el("toast");
  t.textContent = message;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
}

/* ============================================================
   ดาวน์โหลดไฟล์เดียว พร้อมกล่องยืนยันก่อนเริ่มดาวน์โหลด
   ============================================================ */
async function confirmAndDownload(f){
  if (!f) return;
  const ok = await showConfirm("ดาวน์โหลดไฟล์", "ต้องการดาวน์โหลด \u201c" + f.name + "\u201d ใช่หรือไม่?", "ดาวน์โหลด", "ยกเลิก");
  if (!ok) return;
  downloadFile(f);
  showToast("เริ่มดาวน์โหลดไฟล์แล้ว");
}

/* ============================================================
   โหมดเลือกหลายไฟล์ เพื่อดาวน์โหลดพร้อมกัน
   ============================================================ */
function updateSelectionBar(){
  const n = state.selected.size;
  el("selectionCount").textContent = n ? ("เลือกแล้ว " + n + " ไฟล์") : "แตะไฟล์เพื่อเลือก";
  el("selectionDownloadBtn").disabled = n === 0;
}

function toggleFileSelection(id, node){
  if (state.selected.has(id)){
    state.selected.delete(id);
  } else {
    state.selected.add(id);
  }
  node.classList.toggle("selected", state.selected.has(id));
  updateSelectionBar();
}

function enterSelectMode(){
  state.selectMode = true;
  document.body.classList.add("select-mode");
  el("selectToggleBtn").classList.add("active");
  updateSelectionBar();
}

function exitSelectMode(){
  state.selectMode = false;
  state.selected.clear();
  document.body.classList.remove("select-mode");
  el("selectToggleBtn").classList.remove("active");
  document.querySelectorAll("[data-file-id].selected").forEach(n => n.classList.remove("selected"));
  updateSelectionBar();
}

el("selectToggleBtn").addEventListener("click", () => {
  if (state.selectMode) exitSelectMode(); else enterSelectMode();
});
el("selectionCancelBtn").addEventListener("click", exitSelectMode);

el("selectionDownloadBtn").addEventListener("click", async () => {
  const ids = [...state.selected];
  if (!ids.length) return;

  const files = ids.map(id => state.files.find(f => f.id === id)).filter(Boolean);
  if (!files.length) return;

  const ok = await showConfirm(
    "ดาวน์โหลดไฟล์",
    "ต้องการดาวน์โหลดทั้งหมด " + files.length + " ไฟล์ใช่หรือไม่?",
    "ดาวน์โหลด",
    "ยกเลิก"
  );
  if (!ok) return;

  showToast("กำลังดาวน์โหลด " + files.length + " ไฟล์...");

  // เว้นจังหวะการดาวน์โหลดแต่ละไฟล์เล็กน้อย กันเบราว์เซอร์บล็อกการเปิดหลายแท็บพร้อมกัน
  files.forEach((f, i) => {
    setTimeout(() => downloadFile(f), i * 350);
  });

  setTimeout(() => {
    showToast("ดาวน์โหลดครบ " + files.length + " ไฟล์แล้ว");
  }, files.length * 350 + 500);

  exitSelectMode();
});

/* ============================================================
   หน้าต่างดูไฟล์แบบเต็มจอ (รูป / วิดีโอ / เสียง / เอกสาร)
   ============================================================ */
let viewerIndex = -1;

function openViewer(fileId){
  viewerIndex = state.files.findIndex(f => f.id === fileId);
  if (viewerIndex === -1) return;
  showViewerItem();
  el("viewer").classList.add("open");
}

function closeViewer(){
  el("viewer").classList.remove("open");
  el("viewerBody").querySelectorAll("iframe,img").forEach(n => n.remove());
}

function showViewerItem(){

  const f = state.files[viewerIndex];
  if (!f) return;

  el("viewerName").textContent = f.name;
  el("viewerOpenLink").href = f.openUrl;

  const body = el("viewerBody");
  body.querySelectorAll("iframe,img").forEach(n => n.remove());

  let node;
  if (f.type === "image"){
    node = document.createElement("img");
    node.src = "https://lh3.googleusercontent.com/d/" + f.id + "=w1600";
  } else {
    // วิดีโอ / เสียง / เอกสาร (PDF ฯลฯ) ใช้ตัวแสดงตัวอย่างของ Google Drive
    node = document.createElement("iframe");
    node.src = f.viewUrl;
    node.setAttribute("allow", "autoplay");
  }

  body.insertBefore(node, el("viewerPrev"));

}

el("viewerClose").addEventListener("click", closeViewer);
el("viewerPrev").addEventListener("click", () => {
  if (viewerIndex > 0){ viewerIndex--; showViewerItem(); }
});
el("viewerNext").addEventListener("click", () => {
  if (viewerIndex < state.files.length - 1){ viewerIndex++; showViewerItem(); }
});
el("viewerDownloadBtn").addEventListener("click", () => {
  confirmAndDownload(state.files[viewerIndex]);
});

/* รองรับปัดซ้าย-ขวา (Swipe) บนจอสัมผัส เพื่อเปลี่ยนไฟล์ */
let touchStartX = 0;
el("viewerBody").addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; });
el("viewerBody").addEventListener("touchend", (e) => {
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(diff) < 50) return;
  if (diff > 0) el("viewerPrev").click(); else el("viewerNext").click();
});

/* ============================================================
   ดรอปดาวน์แบบกำหนดเอง (ใช้ร่วมกันทั้งตัวกรองวันที่และเรียงลำดับ)
   ============================================================ */
function setupDropdown(ddId, triggerId, menuId, valueId, onSelect){
  const dd = el(ddId), trigger = el(triggerId), menu = el(menuId), valueEl = el(valueId);
  const panel = dd.closest(".search-panel");

  function syncPanelOverflow(){
    if (!panel) return;
    const anyOpen = panel.querySelectorAll(".dd.open").length > 0;
    panel.classList.toggle("dd-open", anyOpen);
  }

  function close(){ dd.classList.remove("open"); syncPanelOverflow(); }
  function toggle(){
    document.querySelectorAll(".dd.open").forEach(d => { if (d !== dd) d.classList.remove("open"); });
    dd.classList.toggle("open");
    syncPanelOverflow();
  }

  trigger.addEventListener("click", (e) => { e.stopPropagation(); toggle(); });

  menu.querySelectorAll(".dd-option").forEach((opt) => {
    opt.addEventListener("click", (e) => {
      e.stopPropagation();
      menu.querySelectorAll(".dd-option").forEach(o => o.classList.remove("selected"));
      opt.classList.add("selected");
      valueEl.textContent = opt.textContent;
      close();
      onSelect(opt.getAttribute("data-value"), opt.textContent);
    });
  });

  return {
    dd, menu, valueEl,
    close,
    setValue(value){
      const match = [...menu.querySelectorAll(".dd-option")].find(o => o.getAttribute("data-value") === value);
      if (!match) return;
      menu.querySelectorAll(".dd-option").forEach(o => o.classList.remove("selected"));
      match.classList.add("selected");
      valueEl.textContent = match.textContent;
    }
  };
}

document.addEventListener("click", () => {
  document.querySelectorAll(".dd.open").forEach(d => d.classList.remove("open"));
  document.querySelectorAll(".search-panel.dd-open").forEach(p => p.classList.remove("dd-open"));
});

function pad2(n){ return String(n).padStart(2, "0"); }
function dateToStr(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function todayStr(){ return dateToStr(new Date()); }

/* ============================================================
   ดึงหน้าจอลงเพื่อรีเฟรช (Pull to refresh)
   ทำงานเมื่ออยู่บนสุดของหน้าจอแล้วลากลงด้วยนิ้ว
   ============================================================ */
(function initPullToRefresh(){
  const indicator = el("ptrIndicator");
  const content = el("content");
  const THRESHOLD = 70;
  const MAX_PULL = 110;

  let startY = 0;
  let pulling = false;
  let refreshing = false;
  let rafId = null;
  let pendingPull = 0;

  function getScrollTop(){
    return window.scrollY || document.documentElement.scrollTop || 0;
  }

  function applyPull(pull){
    indicator.style.opacity = Math.min(pull / THRESHOLD, 1);
    indicator.style.transform = "translate(-50%," + (pull - 50) + "px) rotate(" + (pull * 2.4) + "deg)";
    content.style.transform = pull ? "translateY(" + (pull * 0.5) + "px)" : "";
  }

  function reset(){
    indicator.classList.remove("dragging");
    content.classList.add("ptr-snap");
    indicator.style.opacity = 0;
    indicator.style.transform = "translate(-50%,-60px)";
    content.style.transform = "";
    setTimeout(() => content.classList.remove("ptr-snap"), 220);
  }

  document.addEventListener("touchstart", (e) => {
    if (refreshing) return;
    // เริ่มจับการลากเฉพาะตอนอยู่บนสุดของหน้าเท่านั้น และไม่ได้กดอยู่ในหน้าต่างดูไฟล์
    if (getScrollTop() > 0) return;
    if (el("viewer").classList.contains("open")) return;
    startY = e.touches[0].clientY;
    pulling = true;
    indicator.classList.add("dragging");
    content.classList.remove("ptr-snap");
    content.style.transition = "none";
  }, { passive: true });

  document.addEventListener("touchmove", (e) => {
    if (!pulling || refreshing) return;

    const diff = e.touches[0].clientY - startY;

    if (diff <= 0 || getScrollTop() > 0){
      pendingPull = 0;
    } else {
      pendingPull = Math.min(diff * 0.5, MAX_PULL);
    }

    if (rafId === null){
      rafId = requestAnimationFrame(() => {
        applyPull(pendingPull);
        rafId = null;
      });
    }
  }, { passive: true });

  document.addEventListener("touchend", () => {
    if (!pulling || refreshing) { pulling = false; return; }
    pulling = false;
    content.style.transition = "";

    const opacity = parseFloat(indicator.style.opacity || "0");

    if (opacity >= 1){
      refreshing = true;
      indicator.classList.remove("dragging");
      indicator.classList.add("spin");
      indicator.style.opacity = 1;
      indicator.style.transform = "translate(-50%,16px)";
      content.classList.add("ptr-snap");
      content.style.transform = "";

      loadFiles(true, true).then((success) => {
        showToast(success ? "รีเฟรชข้อมูลสำเร็จ" : "รีเฟรชไม่สำเร็จ ลองอีกครั้ง");
      }).catch(() => {
        showToast("รีเฟรชไม่สำเร็จ ลองอีกครั้ง");
      }).finally(() => {
        setTimeout(() => {
          indicator.classList.remove("spin");
          indicator.style.opacity = 0;
          indicator.style.transform = "translate(-50%,-60px)";
          refreshing = false;
        }, 300);
      });
    } else {
      reset();
    }
  });
})();

/* ============================================================
   เริ่มทำงาน: อ่านค่าจาก URL (?date=YYYY-MM-DD) เผื่อมาจากปุ่มใน LINE
   เพื่อกรองให้เห็นไฟล์ของวันที่ถูกส่งมาโดยอัตโนมัติ
   ============================================================ */
(function init(){
  const urlParams = new URLSearchParams(window.location.search);
  const dateParam = urlParams.get("date");
  if (dateParam){
    state.dateFilter = dateParam;
    if (dateParam === todayStr()){
      dateDD.setValue("today");
    } else if (dateParam === yesterdayStr()){
      dateDD.setValue("yesterday");
    } else {
      dateDD.setValue("custom");
      el("customDateInput").value = dateParam;
      el("customDateWrap").style.display = "flex";
    }
    updateDateFilterBar();
    el("searchPanel").classList.add("open");
    el("searchToggleBtn").classList.add("active");
  }
  loadFiles(true);
})();
</script>
